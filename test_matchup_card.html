<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Tactical Matchup Generator (Vertical 4:5)</title>
    <style>
        :root {
            --bg-color: #0b0e14;
        }

        /* Added a scale down for the browser view so you can actually see 
           the massive 4K canvas on your monitor without scrolling wildly,
           but the Python bot will still capture the full 2160x2700 pixels.
        */
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
            transform: scale(0.5); 
        }

        #controls {
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
            /* Make controls bigger since we zoomed out the body */
            font-size: 24px; 
            transform: scale(2);
            transform-origin: top;
            margin-bottom: 80px;
        }

        select, button {
            padding: 12px 24px;
            font-size: 20px;
            border-radius: 8px;
            border: 2px solid #444;
            background: #333;
            color: white;
            cursor: pointer;
        }

        /* =========================================
           THE NEW 4K EXPORTABLE CANVAS (2160x2700)
           ========================================= */
        #capture-area {
            width: 2160px;
            height: 2700px; 
            background: radial-gradient(circle at center, #1a2235 0%, #080a0f 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* --- Header (Everything Doubled) --- */
        #header {
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .team-block { display: flex; align-items: center; gap: 24px; width: 42%; }
        .team-block.home { justify-content: flex-end; }
        .team-block.away { justify-content: flex-start; }

        .team-logo { width: 100px; height: 100px; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5)); }
        
        .team-info-text { display: flex; flex-direction: column; }
        .team-block.home .team-info-text { align-items: flex-end; }
        .team-block.away .team-info-text { align-items: flex-start; }

        .team-name { font-size: 48px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin: 0; line-height: 1; }
        .formation { font-size: 28px; font-weight: bold; color: #adb5bd; margin-top: 4px; }

        .vs-badge {
            width: 10%;
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 8px 0;
            border-radius: 40px;
            letter-spacing: 4px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* --- 2D Flat Pitch (Everything Doubled) --- */
        #scene {
            width: 100%;
            height: 2500px; 
            position: absolute;
            bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #pitch {
            width: 1960px; 
            height: 2460px; 
            background: repeating-linear-gradient(
                0deg,
                #1e4d2b,
                #1e4d2b 150px,
                #1a4224 150px,
                #1a4224 300px
            );
            position: relative;
            border: 8px solid rgba(255,255,255,0.6);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border-radius: 8px;
        }

        /* Field Lines */
        .pitch-line { position: absolute; border: 6px solid rgba(255,255,255,0.5); z-index: 2; }
        .center-circle { width: 440px; height: 440px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .center-dot { width: 16px; height: 16px; background: rgba(255,255,255,0.5); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; }
        .halfway-line { width: 100%; height: 6px; top: 50%; border-left: none; border-right: none; background: rgba(255,255,255,0.5); border: none; z-index: 2; }
        
        .penalty-box-bottom { width: 880px; height: 320px; bottom: 0; left: 50%; transform: translateX(-50%); border-bottom: none; }
        .six-yard-bottom { width: 440px; height: 120px; bottom: 0; left: 50%; transform: translateX(-50%); border-bottom: none; position: absolute; border: 6px solid rgba(255,255,255,0.5); z-index: 2;}
        .penalty-arc-bottom { width: 320px; height: 180px; bottom: 320px; left: 50%; transform: translateX(-50%); border: 6px solid rgba(255,255,255,0.5); border-bottom: none; border-radius: 180px 180px 0 0; position: absolute; border-bottom-color: transparent; z-index: 2;}
        
        .penalty-box-top { width: 880px; height: 320px; top: 0; left: 50%; transform: translateX(-50%); border-top: none; }
        .six-yard-top { width: 440px; height: 120px; top: 0; left: 50%; transform: translateX(-50%); border-top: none; position: absolute; border: 6px solid rgba(255,255,255,0.5); z-index: 2;}
        .penalty-arc-top { width: 320px; height: 180px; top: 320px; left: 50%; transform: translateX(-50%); border: 6px solid rgba(255,255,255,0.5); border-top: none; border-radius: 0 0 180px 180px; position: absolute; border-top-color: transparent; z-index: 2;}

        .watermark { width: 1200px; height: 1200px; position: absolute; object-fit: contain; opacity: 0.5; transform: translate(-50%, -50%); z-index: 1; pointer-events: none; }
        #home-watermark { top: 75%; left: 50%; }
        #away-watermark { top: 25%; left: 50%; }

        /* =========================================
           PLAYER NODES (The Massive Boost)
           ========================================= */
        .player-node {
            position: absolute;
            width: 320px; /* Giving ample room for long names at 4K */
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        /* MASSIVE BOOST: Scaled from 90px to 230px (~2.5x increase) */
        .player-photo-container {
            width: 230px;  
            height: 230px; 
            border-radius: 50%;
            border: 8px solid var(--node-color); 
            background-color: #2b3035;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7);
            z-index: 3; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .player-photo { width: 100%; height: 100%; object-fit: cover; }
        .fallback-initials { font-size: 72px; font-weight: bold; color: #adb5bd; }

        /* NORMAL SCALE: Strictly doubled to maintain original visual footprint */
        .player-number {
            position: absolute;
            top: -10px; 
            right: 15px; 
            background-color: #111;
            color: white;
            border: 4px solid var(--node-color);
            width: 76px; 
            height: 76px; 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px; 
            font-weight: bold;
            z-index: 4;
        }

        /* MASSIVE BOOST: Increased nameplate for readability */
        .player-nameplate {
            margin-top: -30px; /* Pulls it up to perfectly overlap the larger circle */
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255,255,255,0.3);
            padding: 10px 24px; 
            border-radius: 16px;
            font-size: 32px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 4;
            white-space: nowrap;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div id="controls">
        <label fw-bold>Select Match:</label>
        <select id="match-selector"></select>
        <button onclick="takeScreenshot()">Simulate Screenshot</button>
        <button id="copy-btn" onclick="copyTweetText()">📋 Copy Tweet Text</button>
    </div>

    <div id="capture-area">
        <div id="header">
            <div class="team-block home">
                <div class="team-info-text">
                    <h1 id="home-name" class="team-name">HOME</h1>
                    <div id="home-formation" class="formation">4-3-3</div>
                </div>
                <img id="home-logo" class="team-logo" src="" alt="Home Logo">
            </div>

            <div class="vs-badge">VS</div>

            <div class="team-block away">
                <img id="away-logo" class="team-logo" src="" alt="Away Logo">
                <div class="team-info-text">
                    <h1 id="away-name" class="team-name">AWAY</h1>
                    <div id="away-formation" class="formation">4-3-3</div>
                </div>
            </div>
        </div>

        <div id="scene">
            <div id="pitch">
                <img id="away-watermark" class="watermark" src="" alt="">
                <img id="home-watermark" class="watermark" src="" alt="">

                <div class="pitch-line center-circle"></div>
                <div class="center-dot"></div>
                <div class="halfway-line"></div>
                
                <div class="pitch-line penalty-box-bottom"></div>
                <div class="six-yard-bottom"></div>
                <div class="penalty-arc-bottom"></div>

                <div class="pitch-line penalty-box-top"></div>
                <div class="six-yard-top"></div>
                <div class="penalty-arc-top"></div>
                
                <div id="players-container">
                    </div>
            </div>
        </div>
    </div>

    <script>
        let allMatches = [];

        async function loadData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let targetDate = urlParams.get('date');
                
                if (!targetDate) {
                    const today = new Date();
                    targetDate = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
                }

                const res = await fetch(`data/games_${targetDate}.json`); 
                if (res.ok) {
                    const data = await res.json();
                    allMatches = data.filter(m => m.homeLineup && m.homeLineup.startXI && m.awayLineup && m.awayLineup.startXI);
                } else throw new Error("File not found");
            } catch (e) {
                console.log(`Failed to load data for ${targetDate}.`);
            }
            populateDropdown();
            
            const urlParams = new URLSearchParams(window.location.search);
            const targetFixture = urlParams.get('fixture');
            
            if (targetFixture && allMatches.find(m => m.fixture.id == targetFixture)) {
                document.getElementById('match-selector').value = targetFixture;
                renderMatch(parseInt(targetFixture));
            } else if (allMatches.length > 0) {
                renderMatch(allMatches[0].fixture.id);
            }
        }

        function populateDropdown() {
            const select = document.getElementById('match-selector');
            select.innerHTML = '';
            allMatches.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.fixture.id;
                opt.textContent = `${m.teams.home.name} vs ${m.teams.away.name}`;
                select.appendChild(opt);
            });
            select.addEventListener('change', (e) => { renderMatch(parseInt(e.target.value)); });
        }

        function sliceArrayByFormation(formationStr, startXI) {
            const parts = formationStr.split('-').map(Number);
            const rows = [];
            rows.push([startXI[0]]);
            let currentIndex = 1;
            for (let i = 0; i < parts.length; i++) {
                const count = parts[i];
                rows.push(startXI.slice(currentIndex, currentIndex + count));
                currentIndex += count;
            }
            return rows;
        }

        function getYPositions(numRows, isHome) {
            const homeStart = 95, homeEnd = 58;
            const awayStart = 5, awayEnd = 42;

            if (isHome) {
                const step = (homeStart - homeEnd) / Math.max(1, numRows - 1);
                return Array.from({length: numRows}, (_, i) => homeStart - (step * i));
            } else {
                const step = (awayEnd - awayStart) / Math.max(1, numRows - 1);
                return Array.from({length: numRows}, (_, i) => awayStart + (step * i));
            }
        }

        function getXPositions(numPlayers) {
            if (numPlayers === 1) return [50];
            if (numPlayers === 2) return [35, 65]; 
            if (numPlayers === 3) return [20, 50, 80];
            if (numPlayers === 4) return [15, 38.33, 61.66, 85];
            if (numPlayers === 5) return [10, 30, 50, 70, 90];
            if (numPlayers === 6) return [8, 24.8, 41.6, 58.4, 75.2, 92];
            
            let positions = [];
            let step = 80 / (numPlayers - 1);
            for(let i=0; i<numPlayers; i++) {
                positions.push(10 + (step * i));
            }
            return positions;
        }

        function renderMatch(fixtureId) {
            const match = allMatches.find(m => m.fixture.id === fixtureId);
            if (!match) return;

            document.getElementById('home-name').textContent = match.teams.home.name;
            document.getElementById('home-logo').src = match.teams.home.logo;
            document.getElementById('home-formation').textContent = match.homeLineup.formation;

            document.getElementById('away-name').textContent = match.teams.away.name;
            document.getElementById('away-logo').src = match.teams.away.logo;
            document.getElementById('away-formation').textContent = match.awayLineup.formation;

            document.getElementById('home-watermark').src = match.teams.home.logo;
            document.getElementById('away-watermark').src = match.teams.away.logo;

            let homeColor = match.homeLineup.team?.colors?.player?.primary ? `#${match.homeLineup.team.colors.player.primary}` : '#ffffff';
            let awayColor = match.awayLineup.team?.colors?.player?.primary ? `#${match.awayLineup.team.colors.player.primary}` : '#dddddd';

            const container = document.getElementById('players-container');
            container.innerHTML = '';

            const homeRows = sliceArrayByFormation(match.homeLineup.formation, match.homeLineup.startXI);
            const awayRows = sliceArrayByFormation(match.awayLineup.formation, match.awayLineup.startXI);

            function drawTeam(rows, isHome, teamColor) {
                const numRows = rows.length;
                const yPositions = getYPositions(numRows, isHome); 
                
                rows.forEach((rowPlayers, rowIndex) => {
                    if (!rowPlayers || rowPlayers.length === 0) return;
                    
                    const yPos = yPositions[rowIndex];
                    const numPlayers = rowPlayers.length;
                    const xPositions = getXPositions(numPlayers); 
                    
                    const playersToDraw = isHome ? [...rowPlayers].reverse() : rowPlayers;

                    const baseZIndex = isHome ? (100 - rowIndex) : (10 + rowIndex);

                    playersToDraw.forEach((slot, colIndex) => {
                        const p = slot.player;
                        const xPos = xPositions[colIndex];

                        // ========================================================
                        // FULL NAME LOGIC
                        // ========================================================
                        let displayName = p.name;
                        
                        // Generous truncation to keep long names from breaking the graphic
                        if (displayName.length > 18) {
                            displayName = displayName.substring(0, 16) + '...';
                        }

                        let photoHtml = `<div class="fallback-initials">${p.name.charAt(0).toUpperCase()}</div>`;
                        if (p.photo && p.photo.includes("http")) {
                            photoHtml = `<img src="${p.photo}" class="player-photo" crossorigin="anonymous">`;
                        }

                        const nodeHtml = `
                            <div class="player-node" style="left: ${xPos}%; top: ${yPos}%; z-index: ${baseZIndex}; --node-color: ${teamColor};">
                                <div class="player-number">${p.number || ''}</div>
                                <div class="player-photo-container">
                                    ${photoHtml}
                                </div>
                                <div class="player-nameplate">${displayName}</div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', nodeHtml);
                    });
                });
            }

            drawTeam(awayRows, false, awayColor);
            drawTeam(homeRows, true, homeColor);
        }

        function takeScreenshot() {
            const capture = document.getElementById('capture-area');
            capture.style.opacity = '0.5';
            setTimeout(() => { capture.style.opacity = '1'; }, 100);
            alert("Ready! Your Python bot will capture this mobile-optimized 1080x1350 layout.");
        }

        function copyTweetText() {
            const select = document.getElementById('match-selector');
            const match = allMatches.find(m => m.fixture.id === parseInt(select.value));
            if (!match) return;

            const homeName = match.teams.home.name;
            const awayName = match.teams.away.name;
            const homeHashtag = "#" + homeName.replace(/[^a-zA-Z0-9]/g, '');
            const awayHashtag = "#" + awayName.replace(/[^a-zA-Z0-9]/g, '');

            const tweetText = `🚨 Official Starting XI 🚨\n\n⚽ ${homeName} vs ${awayName}\n\n${homeHashtag} ${awayHashtag}`;

            navigator.clipboard.writeText(tweetText).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = "✅ Copied!";
                btn.style.backgroundColor = "#198754";
                btn.style.borderColor = "#198754";
                setTimeout(() => {
                    btn.textContent = "📋 Copy Tweet Text";
                    btn.style.backgroundColor = "#333";
                    btn.style.borderColor = "#444";
                }, 2000);
            });
        }

        loadData();
    </script>
</body>
</html>
