name: Heal & Clean League Registry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal-leagues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Heal Leagues Script
        run: |
          python scripts/heal_leagues.py

      - name: Commit and Push Cleaned Registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated site_pages.json and track deleted league directories
          git add data/site_pages.json
          git add -u leagues/ || true
          
          git commit -m "🧹 Purged orphan leagues and healed missing pills" || echo "No changes to commit"
          git push
