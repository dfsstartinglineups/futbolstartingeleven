name: Patch Player HTML Files

on:
  workflow_dispatch: # Allows you to manually trigger this from the GitHub UI

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Patch Script
        run: |
          python scripts/patch_js.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only stage changes inside the players directory
          git add players/
          
          if ! git diff --quiet --staged; then
            git commit -m "🔧 Surgically injected player-live.js into 30k player pages [skip ci]"
            
            git pull --rebase origin main || echo "Nothing to pull"
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "No files needed patching. Skipping commit."
          fi
