name: Delete Newest 500 Workflow Runs

on:
  workflow_dispatch: 

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete 500 Runs (Newest First)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Loops 5 times, deleting the 100 newest runs in each batch
          for i in {1..5}; do
            echo "Processing batch $i..."
            gh run list --repo ${{ github.repository }} --limit 100 --json databaseId -q '.[].databaseId' | xargs -r -I{} gh run delete "{}"
          done
