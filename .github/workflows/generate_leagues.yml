name: Generate League Directories

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    paths:
      - 'scripts/generate_league_pages.py' # Auto-runs if you update the generator script

permissions:
  contents: write

jobs:
  build-leagues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run League Page Generator
        run: python scripts/generate_league_pages.py

      - name: Commit and Push Generated Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leagues/
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "chore: auto-generate SEO league directories"
          git push
