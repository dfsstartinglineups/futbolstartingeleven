name: Bulk Data Sync

on:
  workflow_dispatch:

jobs:
  build-dictionaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Master Sync
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python scripts/build_dictionaries.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the files
          git add data/master_teams.json data/master_players.json
          
          if ! git diff --quiet --staged; then
            git commit -m "🤖 Master Data Sync: Updated rosters and ranks [skip ci]"
            # Overwrite strategy: take the local (Bulk Sync) version as truth
            git fetch origin main
            git reset --soft origin/main
            git add data/master_teams.json data/master_players.json
            git commit --amend -m "🤖 Master Data Sync: Updated rosters and ranks [skip ci]"
            git push origin main --force
          else
            echo "No changes to commit."
          fi
