name: Site Manual Build Generator

on:
  workflow_dispatch: # Triggers strictly on demand from the Actions tab

# Prevents overlapping runs when pinged rapidly
concurrency:
  group: futbol-site-build
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest

    # Grants permissions required to commit built static files and cache back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz jinja2 aiohttp
          
      - name: Run Build Script
        run: |
          python scripts/build_index.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.xml data/ images/ leagues/ teams/ players/
          git commit -m "chore: manual build update, match cache sync, and local image cache [skip ci]" || echo "No changes detected to commit."
          git pull --rebase origin main
          git push
