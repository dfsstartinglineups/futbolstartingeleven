name: Site Manual Build Generator

on:
  workflow_dispatch: # Triggers strictly on demand from the Actions tab

# Prevents overlapping runs when pinged rapidly
concurrency:
  group: futbol-site-build
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest

    # Grants permissions required to commit built static files and cache back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz jinja2 aiohttp
          
      - name: Run Build Script
        run: |
          python scripts/build_index.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_RETRIES=5
          COUNT=0

          until [ $COUNT -ge $MAX_RETRIES ]; do
            git fetch origin main
            git reset --soft origin/main
            git add index.html *.xml data/ images/ leagues/ teams/ players/
            
            if git diff-index --quiet HEAD; then
              echo "No changes to commit."
              break
            fi

            git commit -m "chore: manual build update, match cache sync, and local image cache [skip ci]"
            
            if git push origin main; then
              echo "Successfully pushed site updates!"
              break
            fi

            COUNT=$((COUNT+1))
            echo "Push collision detected. Retrying ($COUNT/$MAX_RETRIES)..."
            sleep 2
          done
