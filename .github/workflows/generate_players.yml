name: Generate Player Pages

on:
  workflow_dispatch: # Allows safe manual execution
  schedule:
    - cron: '30 4 * * *' # Fires daily at 4:30 AM UTC (Just after midnight EST)

permissions:
  contents: write

jobs:
  update-player-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Player Generator Pipeline
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python scripts/generate_player_pages.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players/ sitemap-players.xml data/player_database.json
          
          if ! git diff --quiet --staged; then
            git commit -m "🏃 Automated Rolling 10-Game Logs & Player Sitemap Update [skip ci]"
            git pull --rebase origin main || echo "Nothing to rebase"
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "No new log movements detected. Skipping disk commit."
          fi
