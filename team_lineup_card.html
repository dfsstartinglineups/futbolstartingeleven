<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Madrid Starting Lineup | Futbol Starting Eleven</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f1f3f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* --- MAIN SITE NAVBAR STYLES --- */
        .header-brand { 
            font-weight: 900; 
            letter-spacing: -1px; 
            font-size: 2rem; 
            color: #fff; 
            font-style: italic; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
        }
        .header-brand a { color: inherit; }
        .header-brand span { 
            text-shadow: none !important;
            background: linear-gradient(to bottom, #20c997 0%, #198754 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(32, 201, 151, 0.6));
        }

        /* --- RESPONSIVE PITCH WRAPPER --- */
        .pitch-wrapper {
            width: 100%;
            max-width: 650px; /* Slightly widened since we shortened the height */
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* =========================================
           THE EXACT CANVAS (1080x1200) - Reduced Height!
           ========================================= */
        #capture-area {
            width: 1080px;
            height: 1200px; /* Shaved 150px of vertical dead space */
            background: radial-gradient(circle at center, #1a2235 0%, #080a0f 100%);
            position: absolute; 
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top left; 
        }

        /* --- Header: Horizontal Layout --- */
        #header {
            width: 100%;
            padding: 20px 40px 10px 40px;
            display: flex;
            flex-direction: row; /* Aligns logo and text side-by-side */
            justify-content: center;
            align-items: center;
            gap: 25px; /* Spacing between logo and text */
            z-index: 10;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        .team-logo { width: 85px; height: 85px; object-fit: contain; filter: drop-shadow(0 6px 15px rgba(0,0,0,0.6)); }
        
        .header-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .team-name { font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin: 0; line-height: 1; color: white;}
        .formation { font-size: 22px; font-weight: bold; color: #20c997; margin-top: 6px; letter-spacing: 1px; }

        /* --- 2D Flat Half-Pitch --- */
        #scene {
            width: 100%;
            height: 1080px; 
            position: absolute;
            bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-end; 
        }

        #pitch {
            width: 980px; 
            height: 1060px; 
            background: repeating-linear-gradient(
                0deg,
                #1e4d2b,
                #1e4d2b 80px,
                #1a4224 80px,
                #1a4224 160px
            );
            position: relative;
            border: 5px solid rgba(255,255,255,0.6);
            border-top: 8px solid rgba(255,255,255,0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        /* Half-Field Lines */
        .pitch-line { position: absolute; border: 3px solid rgba(255,255,255,0.5); z-index: 2; }
        
        .center-circle-half { 
            width: 280px; 
            height: 140px; 
            border: 4px solid rgba(255,255,255,0.6);
            border-top: none;
            border-radius: 0 0 140px 140px; 
            position: absolute; 
            top: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 2; 
        }
        
        .penalty-box-bottom { width: 500px; height: 180px; bottom: 0; left: 50%; transform: translateX(-50%); border-bottom: none; }
        .six-yard-bottom { width: 250px; height: 70px; bottom: 0; left: 50%; transform: translateX(-50%); border-bottom: none; position: absolute; border: 3px solid rgba(255,255,255,0.5); z-index: 2;}
        .penalty-arc-bottom { width: 180px; height: 100px; bottom: 180px; left: 50%; transform: translateX(-50%); border: 3px solid rgba(255,255,255,0.5); border-bottom: none; border-radius: 90px 90px 0 0; position: absolute; border-bottom-color: transparent; z-index: 2;}

        /* --- Central Watermark --- */
        .watermark {
            position: absolute;
            width: 700px; 
            height: 700px; 
            object-fit: contain;
            opacity: 0.15; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            z-index: 1; 
            pointer-events: none; 
        }

        /* --- Player Nodes --- */
        .player-node {
            position: absolute;
            width: 160px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .player-photo-container {
            width: 120px;
            height: 120px; 
            border-radius: 50%;
            border: 5px solid var(--node-color); 
            background-color: #2b3035;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
            z-index: 3; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .player-photo { width: 100%; height: 100%; object-fit: cover; }
        .fallback-initials { font-size: 40px; font-weight: bold; color: #adb5bd; }

        .player-number {
            position: absolute;
            top: -4px; 
            right: 4px; 
            background-color: #111;
            color: white;
            border: 3px solid var(--node-color);
            width: 32px; 
            height: 32px; 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px; 
            font-weight: 900;
            z-index: 4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .player-nameplate {
            margin-top: -12px; 
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 4px 10px; 
            border-radius: 8px; 
            font-size: 20px; 
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 4;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0,0,0,0.7);
        }

        @media (max-width: 576px) {
            .header-brand { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar sticky-top shadow-sm pt-2 pb-2 mb-4" style="background-color: #212529; z-index: 1050;">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <div class="header-brand">
                <a href="/" class="text-decoration-none">Futbol Starting <span>Eleven</span></a>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="btn btn-sm btn-outline-light fw-bold" style="font-size:0.75rem;">← Back to Matches</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Refined Outer Header (Removed the extra sub-text) -->
        <div class="text-center mb-3 mt-1">
            <h2 class="h5 fw-bold text-dark m-0">Real Madrid Starting Lineup & Tactics</h2>
        </div>

        <div class="pitch-wrapper" id="pitch-wrapper">
            <div id="capture-area">
                
                <!-- Refined Inner Header (Horizontal Layout) -->
                <div id="header">
                    <img id="team-logo" class="team-logo" src="" alt="Team Logo">
                    <div class="header-text">
                        <h1 id="team-name" class="team-name">TEAM NAME</h1>
                        <div id="team-formation" class="formation">Starting XI • 4-3-3</div>
                    </div>
                </div>

                <div id="scene">
                    <div id="pitch">
                        <img id="team-watermark" class="watermark" src="" alt="Watermark">
                        <div class="center-circle-half"></div>
                        <div class="pitch-line penalty-box-bottom"></div>
                        <div class="six-yard-bottom"></div>
                        <div class="penalty-arc-bottom"></div>
                        
                        <div id="players-container"></div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script>
        // ==========================================
        // UPGRADED RESPONSIVE SCALING LOGIC
        // ==========================================
        function resizePitch() {
            const wrapper = document.getElementById('pitch-wrapper');
            const pitch = document.getElementById('capture-area');
            
            const maxWidth = wrapper.clientWidth;
            
            // Allow the graphic to take up slightly more vertical space 
            // since we stripped out the outer header text!
            const maxHeight = window.innerHeight * 0.85; 
            
            const scaleWidth = maxWidth / 1080;
            // Updated to calculate against the new 1200px canvas height
            const scaleHeight = maxHeight / 1200; 
            
            const finalScale = Math.min(scaleWidth, scaleHeight);
            
            pitch.style.transform = `scale(${finalScale})`;
            
            wrapper.style.width = `${1080 * finalScale}px`;
            // Updated to map to the new 1200px canvas height
            wrapper.style.height = `${1200 * finalScale}px`; 
        }

        window.addEventListener('resize', resizePitch);

        // ==========================================
        // HARDCODED MOCK DATA
        // ==========================================
        const mockTeamData = {
            team: { 
                name: "Real Madrid", 
                logo: "https://media.api-sports.io/football/teams/541.png", 
                colors: { player: { primary: "ffffff" } } 
            },
            formation: "4-3-3",
            startXI: [
                { player: { id: 1, name: "Courtois", number: 1, pos: "G", photo: "https://media.api-sports.io/football/players/738.png" } },
                { player: { id: 2, name: "Carvajal", number: 2, pos: "D", photo: "https://media.api-sports.io/football/players/733.png" } },
                { player: { id: 3, name: "Militao", number: 3, pos: "D", photo: "https://media.api-sports.io/football/players/734.png" } },
                { player: { id: 4, name: "Rudiger", number: 22, pos: "D", photo: "https://media.api-sports.io/football/players/26.png" } },
                { player: { id: 5, name: "Mendy", number: 23, pos: "D", photo: "https://media.api-sports.io/football/players/735.png" } },
                { player: { id: 6, name: "Valverde", number: 15, pos: "M", photo: "https://media.api-sports.io/football/players/739.png" } },
                { player: { id: 7, name: "Tchouameni", number: 18, pos: "M", photo: "https://media.api-sports.io/football/players/22.png" } },
                { player: { id: 8, name: "Bellingham", number: 5, pos: "M", photo: "https://media.api-sports.io/football/players/28.png" } },
                { player: { id: 9, name: "Rodrygo", number: 11, pos: "F", photo: "https://media.api-sports.io/football/players/737.png" } },
                { player: { id: 10, name: "Mbappe", number: 9, pos: "F", photo: "https://media.api-sports.io/football/players/25.png" } },
                { player: { id: 11, name: "Vini Jr", number: 7, pos: "F", photo: "https://media.api-sports.io/football/players/736.png" } }
            ]
        };

        function sliceArrayByFormation(formationStr, startXI) {
            const parts = formationStr.split('-').map(Number);
            const rows = [];
            rows.push([startXI[0]]); 
            let currentIndex = 1;
            for (let i = 0; i < parts.length; i++) {
                const count = parts[i];
                rows.push(startXI.slice(currentIndex, currentIndex + count));
                currentIndex += count;
            }
            return rows;
        }

        function getYPositions(numRows) {
            const bottomStart = 88; 
            const topEnd = 14; 
            const step = (bottomStart - topEnd) / Math.max(1, numRows - 1);
            return Array.from({length: numRows}, (_, i) => bottomStart - (step * i));
        }

        function getXPositions(numPlayers) {
            if (numPlayers === 1) return [50];
            if (numPlayers === 2) return [32, 68]; 
            if (numPlayers === 3) return [20, 50, 80];
            if (numPlayers === 4) return [14, 38, 62, 86];
            if (numPlayers === 5) return [10, 30, 50, 70, 90];
            
            let positions = [];
            let step = 80 / (numPlayers - 1);
            for(let i=0; i<numPlayers; i++) {
                positions.push(10 + (step * i));
            }
            return positions;
        }

        function renderMatch() {
            document.getElementById('team-name').textContent = mockTeamData.team.name;
            document.getElementById('team-logo').src = mockTeamData.team.logo;
            document.getElementById('team-watermark').src = mockTeamData.team.logo;
            document.getElementById('team-formation').textContent = `Starting XI • ${mockTeamData.formation}`;

            let teamColor = mockTeamData.team.colors?.player?.primary ? `#${mockTeamData.team.colors.player.primary}` : '#ffffff';

            const container = document.getElementById('players-container');
            container.innerHTML = '';

            const rows = sliceArrayByFormation(mockTeamData.formation, mockTeamData.startXI);
            const numRows = rows.length;
            const yPositions = getYPositions(numRows); 
            
            rows.forEach((rowPlayers, rowIndex) => {
                if (!rowPlayers || rowPlayers.length === 0) return;
                
                const yPos = yPositions[rowIndex];
                const numPlayers = rowPlayers.length;
                const xPositions = getXPositions(numPlayers); 
                
                const baseZIndex = 100 - rowIndex;

                rowPlayers.forEach((slot, colIndex) => {
                    const p = slot.player;
                    const xPos = xPositions[colIndex];

                    let displayName = p.name;
                    if (displayName.length > 18) {
                        displayName = displayName.substring(0, 16) + '...';
                    }

                    let photoHtml = `<div class="fallback-initials">${p.name.charAt(0).toUpperCase()}</div>`;
                    if (p.photo && p.photo.includes("http")) {
                        photoHtml = `<img src="${p.photo}" class="player-photo" crossorigin="anonymous">`;
                    }

                    const nodeHtml = `
                        <div class="player-node" style="left: ${xPos}%; top: ${yPos}%; z-index: ${baseZIndex}; --node-color: ${teamColor};">
                            <div class="player-number">${p.number || ''}</div>
                            <div class="player-photo-container">
                                ${photoHtml}
                            </div>
                            <div class="player-nameplate">${displayName}</div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', nodeHtml);
                });
            });

            // Ensure the pitch resizes properly once content is loaded
            resizePitch();
        }

        renderMatch();
    </script>
</body>
</html>
